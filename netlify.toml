[build]
command = "npm run build"
publish = "dist"

# Allow FormSpree Form ID to be included in build output
# This is safe because it's a public form endpoint ID, not a secret API key
[build.environment]
SECRETS_SCAN_OMIT_KEYS = "VITE_FORMSPREE_FORM_ID"

# Astro 7 exige Node >=22.12. Sin fijarlo, Netlify usa el default del sitio
# (heredado de cuando era un proyecto Vite/React) y el build falla.
NODE_VERSION = "22"

# Canonicalize case variants and trailing slashes
[[redirects]]
from = "/Blog"
to = "/blog"
status = 301
force = true

[[redirects]]
from = "/Blog/*"
to = "/blog/:splat"
status = 301
force = true

[[redirects]]
from = "/blog/*/"
to = "/blog/:splat"
status = 301
force = true

[[redirects]]
from = "/blog/"
to = "/blog"
status = 301
force = true
