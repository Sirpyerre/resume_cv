[build]
command = "npm run build"
publish = "dist"

# Ambos valores son publicos por diseno y terminan en el HTML:
# el Form ID de FormSpree es un endpoint publico, y el numero de WhatsApp
# se muestra en los enlaces wa.me. Sin declararlos, el escaner falla el build.
[build.environment]
SECRETS_SCAN_OMIT_KEYS = "VITE_FORMSPREE_FORM_ID,VITE_WHATSAPP_NUMBER"

# Astro 7 exige Node >=22.12. Sin fijarlo, Netlify usa el default del sitio
# (heredado de cuando era un proyecto Vite/React) y el build falla.
NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Cabeceras de seguridad
#
# El grueso del CSP (default-src, script-src con hashes, style-src, img-src...)
# lo emite Astro por pagina en un <meta http-equiv>, porque necesita los sha256
# de cada script y style inline y esos cambian por pagina. Ver security.csp en
# astro.config.mjs.
#
# Aqui solo queda frame-ancestors: el spec manda ignorarlo en <meta>, asi que
# tiene que viajar en cabecera. Ojo, no se puede repetir el resto de directivas
# aqui: las dos politicas se aplican a la vez y la interseccion manda, asi que
# un default-src 'self' en la cabecera bloquearia los inline que el meta permite.
# ---------------------------------------------------------------------------
[[headers]]
for = "/*"

  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()"
  Cross-Origin-Opener-Policy = "same-origin"
  Content-Security-Policy = "frame-ancestors 'none'"
  # Netlify ya manda HSTS por su cuenta, pero sin includeSubDomains y dependiendo
  # de un default de plataforma. Declararlo fija el valor y cubre los subdominios.
  Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Los assets con hash en el nombre son inmutables.
[[headers]]
for = "/_astro/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Redirects
#
# Aqui NO hay reglas de barra final: Netlify normaliza la barra antes de aplicar
# los redirects, asi que /blog y /blog/ son la misma ruta para el matcher. Las
# reglas que habia para quitarla no se ejecutaban nunca, y forzarlas haria bucle.
# La forma canonica (con barra) la fija trailingSlash en astro.config.mjs.
# ---------------------------------------------------------------------------

# Variantes con mayuscula heredadas del sitio anterior. El destino ya lleva la
# barra para no encadenar dos 301 (/Blog -> /blog -> /blog/).
[[redirects]]
from = "/Blog"
to = "/blog/"
status = 301
force = true

# :slug en vez de *: el splat de Netlify solo es valido al final de la ruta, y
# aqui hace falta anadir la barra despues del segmento capturado.
[[redirects]]
from = "/Blog/:slug"
to = "/blog/:slug/"
status = 301
force = true

# Search Console tiene enviado /sitemap.xml desde el sitio React, que la
# migracion borro. Astro emite sitemap-index.xml; sin este puente esa entrada
# sigue devolviendo 404 y Google no descubre ninguna URL por sitemap.
[[redirects]]
from = "/sitemap.xml"
to = "/sitemap-index.xml"
status = 301
force = true
